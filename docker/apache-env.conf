# Pass Railway / container environment variables into PHP (mod_php)
PassEnv APP_DEBUG DB_DEBUG DB_HOST DB_PORT DB_NAME DB_USER DB_PASS DB_CHARSET
PassEnv MYSQLHOST MYSQLPORT MYSQLUSER MYSQLPASSWORD MYSQLDATABASE MYSQL_URL DATABASE_URL
PassEnv SMTP_ENABLED SMTP_HOST SMTP_PORT SMTP_SECURE SMTP_USER SMTP_PASS SMTP_TIMEOUT
PassEnv MAIL_FROM_EMAIL MAIL_FROM_NAME MAIL_ALWAYS_LOG MAIL_SHOW_RESET_LINK_ON_FAILURE
